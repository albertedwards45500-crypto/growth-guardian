name: growth-guardian

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: baby_growth
      MYSQL_USER: baby_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python3 deploy/init_env.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 deploy/init_env.py first}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
      - --performance-schema=OFF
      - --mysqlx=OFF
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 768m
    cpus: 1.0
    logging: *logging

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      DEBUG: "false"
      DATABASE_URL: mysql+pymysql://baby_user:${MYSQL_PASSWORD}@db:3306/baby_growth?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:?Run python3 deploy/init_env.py first}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      LOG_LEVEL: INFO
      LOG_DIR: /app/logs
      TZ: Asia/Shanghai
      ADVISOR_AGENT_ENABLED: "false"
      RAG_ENABLED: "false"
      LANGSMITH_TRACING: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs
      - backend-data:/app/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    init: true
    mem_limit: 512m
    cpus: 0.9
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/health]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 64m
    cpus: 0.25
    logging: *logging

volumes:
  mysql-data:
  backend-logs:
  backend-data:
