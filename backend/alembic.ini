# =============================================================================
# @file: backend/alembic.ini
# @description: Alembic 数据库迁移配置。
#               sqlalchemy.url 留空占位：实际连接串由 migrations/env.py 在运行时解析注入
#               （优先级：-x db_url 命令行参数 > config.attributes["db_url"] 程序化注入
#               > app.core.config.settings.DATABASE_URL），
#               避免将数据库凭据硬编码写入仓库。
# =============================================================================

[alembic]
# 迁移脚本目录（相对 alembic.ini 所在目录；程序化调用时建议以绝对路径覆盖）
script_location = migrations
# 自动生成的新迁移文件命名：版本号_描述（如 0001_initial_schema）
file_template = %%(rev)s_%%(slug)s
# 将当前工作目录加入 sys.path，保证在 backend/ 下执行 alembic 时可导入 app 包
prepend_sys_path = .
# 路径分隔符按系统解析（消除旧版空格/逗号/冒号分割的弃用告警）
path_separator = os
# 数据库连接串：留空占位，实际值由 migrations/env.py 注入
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
